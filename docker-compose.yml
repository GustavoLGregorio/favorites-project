version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: favorites-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: favorites_db
      POSTGRES_USER: favorites_user
      POSTGRES_PASSWORD: favorites_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U favorites_user -d favorites_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  miniflare:
    image: node:22-alpine
    container_name: favorites-miniflare
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8787:8787" # Worker HTTP dev server
      - "8788:8788" # Miniflare R2 / KV local emulation
    volumes:
      - ./workers:/app
    command: npx wrangler dev --host 0.0.0.0 --port 8787

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: favorites-api
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=favorites_db;Username=favorites_user;Password=favorites_password
      - Cloudflare__R2__Endpoint=http://miniflare:8788
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: favorites-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
      - NEXT_PUBLIC_WORKERS_URL=http://localhost:8787
    depends_on:
      - api
      - miniflare

volumes:
  postgres_data:
